<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crossword Nexus Variety Solver</title>
  <link href="styles.css" rel="stylesheet">

  <!-- Core libs -->
  <script src="lscache.min.js"></script>
  <script src="jscrossword_combined.js"></script>

  <!-- Compression -->
  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
</head>

<body>
  <!-- Overlay for opening puzzles -->
  <div class="cw-open-holder" id="cw-open-holder">
    <div class="cw-overflow"></div>
    <div class="cw-open-puzzle">
      <div class="cw-open-puzzle-instructions">
        Click the button or <strong>drag a .vpuz file here</strong> to open.
      </div>
      <button type="button" class="cw-button info-button" id="open-vpuz-button">
        Open vPuz file
      </button>
    </div>
    <input type="file" class="cw-open-vpuz" id="open-vpuz-input" accept=".vpuz">
  </div>
  <!-- end overlay -->

  <div id="puzzle-container">
    <div id="container">
      <!-- Mobile clue bar -->
      <div id="mobile-clue-bar" class="mobile-clue-bar">
        <button type="button" id="mobile-prev-clue" class="mobile-clue-nav" aria-label="Previous Clue">&lt;</button>
        <div id="mobile-clue-content" class="mobile-clue-content" title="Click to toggle completed">
          <div id="mobile-clue-header" class="mobile-clue-header"></div>
          <div id="mobile-clue-text" class="mobile-clue-text"></div>
        </div>
        <button type="button" id="mobile-next-clue" class="mobile-clue-nav" aria-label="Next Clue">&gt;</button>
      </div>

      <div id="puzzle-image-container">
        <div class="puzzle-image-wrapper">
          <img id="puzzle-image" alt="Puzzle Image">
          <canvas id="canvas"></canvas>
          <div class="button-container" id="button-container">
            <button class="info-button" id="infoButton">Info</button>
            <button class="info-button" id="printButton">Print</button>

            <!-- Font size slider -->
            <div class="font-size-control">
              <span class="font-indicator small-a">A</span>
              <input type="range" min="20" max="50" value="30" id="font-slider" title="Font size">
              <span class="font-indicator large-a">A</span>
            </div>

          </div>
        </div>
      </div>
      <div id="clue-panels">
        <div id="clues-0" class="clue-panel">
          <h2 id="clues-0-title"></h2>
          <ul class="clue-list" id="clue-list-0"></ul>
        </div>
        <div id="clues-1" class="clue-panel">
          <h2 id="clues-1-title"></h2>
          <ul class="clue-list" id="clue-list-1"></ul>
        </div>
      </div>
    </div>

    <!-- Spinner overlay -->
    <div id="spinner-overlay">
      <div class="spinner"></div>
    </div>

    <!-- Modal -->
    <div class="modal" id="infoModal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" id="modal-title"></h2>
          <span class="modal-close" id="closeModal">&times;</span>
        </div>
        <div class="modal-body" id="modal-body"></div>
      </div>
    </div>

    <!-- Virtual Keyboard for Mobile -->
    <div id="virtual-keyboard" class="virtual-keyboard" role="toolbar" aria-label="Virtual Keyboard">
      <div class="vk-row">
        <button type="button" class="vk-key" data-key="Q">Q</button>
        <button type="button" class="vk-key" data-key="W">W</button>
        <button type="button" class="vk-key" data-key="E">E</button>
        <button type="button" class="vk-key" data-key="R">R</button>
        <button type="button" class="vk-key" data-key="T">T</button>
        <button type="button" class="vk-key" data-key="Y">Y</button>
        <button type="button" class="vk-key" data-key="U">U</button>
        <button type="button" class="vk-key" data-key="I">I</button>
        <button type="button" class="vk-key" data-key="O">O</button>
        <button type="button" class="vk-key" data-key="P">P</button>
      </div>
      <div class="vk-row">
        <button type="button" class="vk-key" data-key="A">A</button>
        <button type="button" class="vk-key" data-key="S">S</button>
        <button type="button" class="vk-key" data-key="D">D</button>
        <button type="button" class="vk-key" data-key="F">F</button>
        <button type="button" class="vk-key" data-key="G">G</button>
        <button type="button" class="vk-key" data-key="H">H</button>
        <button type="button" class="vk-key" data-key="J">J</button>
        <button type="button" class="vk-key" data-key="K">K</button>
        <button type="button" class="vk-key" data-key="L">L</button>
      </div>
      <div class="vk-row">
        <button type="button" class="vk-key vk-key-special vk-key-hide" data-action="hide" aria-label="Hide keyboard" title="Hide keyboard">&#x25BE; Hide</button>
        <button type="button" class="vk-key" data-key="Z">Z</button>
        <button type="button" class="vk-key" data-key="X">X</button>
        <button type="button" class="vk-key" data-key="C">C</button>
        <button type="button" class="vk-key" data-key="V">V</button>
        <button type="button" class="vk-key" data-key="B">B</button>
        <button type="button" class="vk-key" data-key="N">N</button>
        <button type="button" class="vk-key" data-key="M">M</button>
        <button type="button" class="vk-key" data-key="+">+</button>
        <button type="button" class="vk-key vk-key-special vk-key-backspace" data-key="Backspace" aria-label="Backspace" title="Backspace">&#x232B;</button>
      </div>
    </div>

    <!-- Floating button to restore keyboard when collapsed -->
    <button type="button" id="vk-show-button" class="vk-show-button" aria-label="Show keyboard" title="Show keyboard">
      <span class="vk-show-icon">&#9000;</span>
      <span class="vk-show-label">Keyboard</span>
    </button>
  </div>

  <!-- Load main puzzle logic -->
  <script src="script.js"></script>

  <!-- Inline boot logic -->
  <script type="text/javascript">
    /** Spinner controls **/
    function showSpinner() {
      document.getElementById("spinner-overlay").style.display = "flex";
    }

    function hideSpinner() {
      document.getElementById("spinner-overlay").style.display = "none";
    }

    /** Show puzzle / hide overlay **/
    let isOpenHolderVisible = false;
    function showPuzzle() {
      document.getElementById("cw-open-holder").style.display = "none";
      isOpenHolderVisible = false;
      document.getElementById("puzzle-container").style.display = "flex";
    }

    /** Normalize remote puzzle image (optional) **/
    async function normalizeImage(data) {
      const imgSrc = data["puzzle-image"];
      if (imgSrc && /^https?:\/\//i.test(imgSrc)) {
        try {
          const response = await fetch(imgSrc);
          const blob = await response.blob();
          const reader = new FileReader();
          data["puzzle-image"] = await new Promise((resolve, reject) => {
            reader.onloadend = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(blob);
          });
          console.log("Fetched & re-encoded image.");
        } catch (err) {
          console.warn("Failed to re-encode hosted image:", err);
        }
      }
      return data;
    }

    /** Load puzzle data with spinner **/
    function loadPuzzleWithSpinner(data) {
      showSpinner();

      // Hide puzzle content until image fully loaded
      const container = document.getElementById("container");
      container.classList.remove("visible");

      // Build puzzle
      loadPuzzle(data);

      const img = document.getElementById("puzzle-image");
      if (!img) {
        hideSpinner();
        container.classList.add("visible");
        return;
      }

      function finishLoading() {
        hideSpinner();
        container.classList.add("visible");
      }

      if (img.complete) {
        finishLoading();
      } else {
        img.addEventListener("load", finishLoading, {
          once: true
        });
        img.addEventListener("error", finishLoading, {
          once: true
        });
      }
    }

    /** Read File as JSON and load **/
    function loadJsonFile(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const json = JSON.parse(e.target.result);
          showPuzzle();
          loadPuzzleWithSpinner(json);
        } catch (err) {
          console.error("Error parsing JSON:", err);
          alert("Could not read that file.");
        }
      };
      reader.onerror = () => console.error("Error reading file:", reader.error);
      reader.readAsText(file);
    }

    /** Try to load a dropped .vpuz file **/
    function tryLoadDroppedVpuzFile(files) {
      if (!files?.length) return;
      const file = files[0];
      if (!file.name.toLowerCase().endsWith(".vpuz")) {
        alert("Please drop a .vpuz file.");
        return;
      }
      loadJsonFile(file);
    }

    document.addEventListener("DOMContentLoaded", function() {
      if (typeof window.fetch !== "function") {
        alert("Please upgrade to a modern browser");
      }

      const openHolder = document.getElementById("cw-open-holder");
      const fileInput = document.getElementById("open-vpuz-input");
      const url = new URL(window.location.href);
      const puzzleParam = url.searchParams.get("puzzle") || url.searchParams.get("file");

      const handleGlobalDragover = (event) => {
        if (!isOpenHolderVisible) return;
        event.preventDefault();
      };

      const handleGlobalDrop = (event) => {
        if (!isOpenHolderVisible) return;
        event.preventDefault();
        event.stopPropagation();
        openHolder.classList.remove("dragover");
        tryLoadDroppedVpuzFile(event.dataTransfer?.files);
      };

      window.addEventListener("dragover", handleGlobalDragover);
      window.addEventListener("drop", handleGlobalDrop);

      /** Try to load compressed puzzle from hash **/
      function tryLoadFromHash() {
        const hash = window.location.hash.slice(1);
        if (!hash) return false;
        try {
          const jsonText = LZString.decompressFromEncodedURIComponent(hash);
          if (!jsonText) return false;
          const data = JSON.parse(jsonText);
          showPuzzle();
          loadPuzzleWithSpinner(data);
          return true;
        } catch (e) {
          console.error("Failed to decode LZ-hash puzzle:", e);
          return false;
        }
      }

      // 1️⃣ Hash fragment
      if (tryLoadFromHash()) return;

      // 2️⃣ Local upload
      if (!puzzleParam) {
        openHolder.style.display = "flex";
        isOpenHolderVisible = true;

        fileInput.addEventListener("change", (e) => {
          if (e.target.files?.length) loadJsonFile(e.target.files[0]);
        });

        // Drag & drop support
        ["dragover", "dragleave"].forEach((event) => {
          openHolder.addEventListener(event, (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (event === "dragover") openHolder.classList.add("dragover");
            else openHolder.classList.remove("dragover");
          });
        });

      }

      // 3️⃣ Remote fetch (?puzzle= or ?file=)
      else {
        showPuzzle();
        fetch(puzzleParam)
          .then((r) => {
            if (r.ok || r.status === 0) return r.json();
            throw new Error(r.statusText);
          })
          .then(normalizeImage)
          .then(loadPuzzleWithSpinner)
          .catch((err) => console.error("Error fetching puzzle:", err));
      }
    });
  </script>
</body>

</html>
